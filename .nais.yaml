apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: pleesah-havnesjef
  namespace: leesah
spec:
  accessPolicy:
    inbound:
      rules:
        - application: pleesah-game
        - application: pleesah-skattekart
  envFrom:
    - secret: pleesah-havnesjef
    - configmap: pleesah-havnesjef
  ingresses:
    - https://pleesah.intern.nav.no
